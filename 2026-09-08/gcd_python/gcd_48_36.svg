<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 613" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <text x="390.0" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#172033">Euclidean algorithm: gcd(48, 36) = 12</text>
  <text x="390.0" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">Take the biggest squares first; each remaining strip creates a smaller square size.</text>
  <g>
    <rect x="170.00" y="115.00" width="360.00" height="360.00" fill="#ff6b6b" stroke="#172033" stroke-width="2"/>
    <text x="350.00" y="300.00" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#172033">36×36</text>
    <rect x="530.00" y="355.00" width="120.00" height="120.00" fill="#4dabf7" stroke="#172033" stroke-width="2"/>
    <text x="590.00" y="420.00" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#172033">12×12</text>
    <rect x="530.00" y="235.00" width="120.00" height="120.00" fill="#4dabf7" stroke="#172033" stroke-width="2"/>
    <text x="590.00" y="300.00" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#172033">12×12</text>
    <rect x="530.00" y="115.00" width="120.00" height="120.00" fill="#4dabf7" stroke="#172033" stroke-width="2"/>
    <text x="590.00" y="180.00" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#172033">12×12</text>
  </g>
  <rect x="100.0" y="532.0" width="15" height="15" fill="#ff6b6b" stroke="#172033"/>
  <text x="122.0" y="545.0" font-family="Arial, sans-serif" font-size="14" fill="#172033">Step 1: 1 square(s) of 36×36</text>
  <rect x="410.0" y="532.0" width="15" height="15" fill="#4dabf7" stroke="#172033"/>
  <text x="432.0" y="545.0" font-family="Arial, sans-serif" font-size="14" fill="#172033">Step 2: 3 square(s) of 12×12</text>
  <text x="410.0" y="510.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#172033">Width = 48</text>
  <text x="140.0" y="295.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#172033" transform="rotate(-90 140.0 295.0)">Height = 36</text>
</svg>