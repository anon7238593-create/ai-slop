<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1151" viewBox="0 0 1400 1151" style="max-width: 100%; height: auto;">
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <text x="700.0" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#172033">Euclidean algorithm: gcd(48, 36) = 12</text>
  <text x="700.0" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#475569">Take the biggest squares first; each remaining strip creates a smaller square size.</text>
  <g>
    <rect x="163.33" y="130.00" width="850.00" height="850.00" fill="#ff6b6b" stroke="#172033" stroke-width="2.5"/>
    <text x="588.33" y="563.67" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#172033">36×36</text>
    <rect x="1013.33" y="696.67" width="283.33" height="283.33" fill="#4dabf7" stroke="#172033" stroke-width="2.5"/>
    <text x="1155.00" y="847.00" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#172033">12×12</text>
    <rect x="1013.33" y="413.33" width="283.33" height="283.33" fill="#4dabf7" stroke="#172033" stroke-width="2.5"/>
    <text x="1155.00" y="563.67" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#172033">12×12</text>
    <rect x="1013.33" y="130.00" width="283.33" height="283.33" fill="#4dabf7" stroke="#172033" stroke-width="2.5"/>
    <text x="1155.00" y="280.33" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#172033">12×12</text>
  </g>
  <rect x="130.0" y="1052.0" width="22" height="22" fill="#ff6b6b" stroke="#172033" stroke-width="1.5"/>
  <text x="162.0" y="1070.0" font-family="Arial, sans-serif" font-size="18" fill="#172033">Step 1: 1 square(s) of 36×36</text>
  <rect x="530.0" y="1052.0" width="22" height="22" fill="#4dabf7" stroke="#172033" stroke-width="1.5"/>
  <text x="562.0" y="1070.0" font-family="Arial, sans-serif" font-size="18" fill="#172033">Step 2: 3 square(s) of 12×12</text>
  <text x="730.0" y="1025.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#172033">Width = 48</text>
  <text x="123.3" y="555.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#172033" transform="rotate(-90 123.3 555.0)">Height = 36</text>
</svg>