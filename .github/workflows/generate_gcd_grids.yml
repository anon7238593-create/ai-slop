name: Generate GCD grid visualizations

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - artifacts
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write
  actions: read

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch artifacts branch metadata
        run: |
          git fetch --filter=blob:none --depth=1 origin artifacts:refs/remotes/origin/artifacts || true

      - name: Generate colored GCD grids
        env:
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/gcd-grids
        run: |
          mkdir -p "$ARTIFACT_DIRECTORY"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          sys.path.insert(0, "2026-09-08/gcd_python")
          from gcd_grid import fresh_seed, random_dimensions, svg_visualization

          out = Path(os.environ["ARTIFACT_DIRECTORY"])

          # Avoid pairs used in the previous run on the artifacts branch
          used: set[tuple[int, int]] = set()
          try:
              proc = subprocess.run(
                  ["git", "show", "origin/artifacts:gcd-grids/manifest.json"],
                  capture_output=True,
                  text=True,
              )
              if proc.returncode == 0:
                  prev_data = json.loads(proc.stdout)
                  for grid in prev_data.get("grids", []):
                      a, b = int(grid["a"]), int(grid["b"])
                      used.add((min(a, b), max(a, b)))
                  print(f"Loaded {len(used)} existing pair(s) from artifacts branch to avoid repeats.")
          except Exception as e:
              print(f"Notice: could not load previous manifest: {e}")

          TOTAL_GRIDS = 100
          grids = []
          for index in range(TOTAL_GRIDS):
              while True:
                  seed = fresh_seed()
                  width, height = random_dimensions(seed)
                  pair_key = (min(width, height), max(width, height))
                  if pair_key not in used:
                      break
              used.add(pair_key)
              svg, divisor, steps, squares = svg_visualization(width, height, seed)
              name = f"gcd-{width}-{height}.svg"
              (out / name).write_text(svg, encoding="utf-8")
              grids.append(
                  {
                      "file": name,
                      "a": width,
                      "b": height,
                      "gcd": divisor,
                      "seed": seed,
                      "steps": steps,
                      "squares": squares,
                  }
              )
              if (index + 1) % 20 == 0 or index == TOTAL_GRIDS - 1:
                  print(f"Generated {index + 1}/{TOTAL_GRIDS}: {width} × {height} (gcd={divisor}, seed={seed})")

          generated_at = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          (out / "manifest.json").write_text(
              json.dumps({"generated_at": generated_at, "total": len(grids), "grids": grids}, indent=2) + "\n",
              encoding="utf-8",
          )
          rows = "\n".join(
              f"| `{grid['file']}` | {grid['a']} | {grid['b']} | {grid['gcd']} | {grid['seed']} |"
              for grid in grids
          )
          (out / "README.md").write_text(
              "# GCD Grid Visualizations\n\n"
              "Each GitHub Actions run generates random seeds for a and b to tile new random rectangles with Euclidean squares.\n"
              f"Generated at: {generated_at}\n\n"
              "| File | a | b | gcd | seed |\n"
              "| --- | --- | --- | --- | --- |\n"
              f"{rows}\n",
              encoding="utf-8",
          )
          PY

      - name: Commit and push grids to the artifacts branch
        env:
          TARGET_DIR: gcd-grids
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/gcd-grids
          COMMIT_TITLE: "Generate 100 GCD grid visualizations"
        run: |
          export COMMIT_DESCRIPTION="Generated $(jq -r '.total // (.grids | length)' "$ARTIFACT_DIRECTORY"/manifest.json) unique random GCD grid visualizations with diverse dimensions."
          bash .github/scripts/push_artifacts.sh
