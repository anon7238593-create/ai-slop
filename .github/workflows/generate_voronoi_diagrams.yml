name: Generate Voronoi diagrams

on:
  workflow_dispatch:
  push:
    # This workflow writes to artifacts; ignoring it prevents a trigger loop.
    branches-ignore:
      - artifacts
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

# Shared with the traversal workflow: both publish to the same branch.
concurrency:
  group: visualization-artifacts
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SVG collection
        env:
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/voronoi-diagrams
        run: |
          seed="$(date -u +%s)"
          python3 2026-09-05/voronoi_diagram/voronoi_svg_generator.py \
            --seed "$seed" \
            --output "$ARTIFACT_DIRECTORY"

      - name: Commit SVGs to the artifacts branch
        env:
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/voronoi-diagrams
        run: |
          git fetch origin artifacts || true
          if git show-ref --verify --quiet refs/remotes/origin/artifacts; then
            git switch --force-create artifacts origin/artifacts
          else
            git switch --orphan artifacts
            git rm -rf . || true
          fi
          rm -rf voronoi
          cp -R "$ARTIFACT_DIRECTORY" voronoi
          git add voronoi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate Voronoi diagrams" \
            -m "Voronoi seed: $(jq -r .seed voronoi/manifest.json)"
          git push origin HEAD:artifacts
