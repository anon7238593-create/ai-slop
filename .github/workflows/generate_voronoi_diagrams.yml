name: Generate Voronoi diagrams

on:
  workflow_dispatch:
  push:
    # This workflow writes to artifacts; ignoring it prevents a trigger loop.
    branches-ignore:
      - artifacts
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write
  actions: read

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SVG collection
        env:
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/voronoi-diagrams
        run: |
          seed="$(date -u +%s)"
          python3 2026-09-05/voronoi_diagram/voronoi_svg_generator.py \
            --seed "$seed" \
            --output "$ARTIFACT_DIRECTORY"

      - name: Create GitHub Release for Voronoi diagrams
        env:
          TARGET_DIR: voronoi
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/voronoi-diagrams
          RELEASE_TITLE: "Generate Voronoi diagrams"
          GH_TOKEN: ${{ github.token }}
        run: |
          export COMMIT_DESCRIPTION="Voronoi seed: $(jq -r .seed "$ARTIFACT_DIRECTORY"/manifest.json)"
          bash .github/scripts/create_release.sh

      - name: Commit and push SVGs to the artifacts branch
        env:
          TARGET_DIR: voronoi
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/voronoi-diagrams
          COMMIT_TITLE: "Generate Voronoi diagrams"
          GH_TOKEN: ${{ github.token }}
        run: |
          export COMMIT_DESCRIPTION="Voronoi seed: $(jq -r .seed "$ARTIFACT_DIRECTORY"/manifest.json)"
          bash .github/scripts/push_artifacts.sh
