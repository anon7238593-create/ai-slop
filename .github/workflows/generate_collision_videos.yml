name: Generate ball collision videos

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Number of randomized collision videos to generate"
        required: false
        default: "20"
        type: string
      min_balls:
        description: "Minimum number of balls per video (optional, defaults to min(12, max_balls))"
        required: false
        type: string
      max_balls:
        description: "Maximum number of balls per video (up to 1000)"
        required: false
        default: "100"
        type: string
  push:
    # Ignoring artifacts branch prevents recursive workflow triggering
    branches-ignore:
      - master # currently ignore it because this workflow is causing too much usage
      - artifacts
  schedule:
    - cron: "5 1 * * *"

permissions:
  contents: write
  actions: read

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          pip install numpy opencv-python-headless

      - name: Generate randomized ball collision videos (1920x1080)
        env:
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/collision-videos
          VIDEO_COUNT: ${{ inputs.count || 20 }}
          MIN_BALLS: ${{ inputs.min_balls || '' }}
        run: |
          mkdir -p "$ARTIFACT_DIRECTORY"
          EXTRA_ARGS=()
          if [ -n "$MIN_BALLS" ]; then
            EXTRA_ARGS+=(--min-balls "$MIN_BALLS")
          fi
          python3 2026-09-09/collision/generate_batch.py \
            --count "$VIDEO_COUNT" \
            --max-balls "${{ inputs.max_balls || 100 }}" \
            "${EXTRA_ARGS[@]}" \
            --width 1920 \
            --height 1080 \
            --output-dir "$ARTIFACT_DIRECTORY" \
            --workers 2

      - name: Commit and push collision videos to the artifacts branch
        env:
          TARGET_DIR: collision-videos
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/collision-videos
          COMMIT_TITLE: "Generate 20 random ball collision videos (1920x1080)"
        run: |
          export COMMIT_DESCRIPTION="Generated $(jq -r '.total_videos // (.videos | length)' "$ARTIFACT_DIRECTORY"/manifest.json) distinct randomized 1920x1080 ball collision videos with slow analytical speeds and random inward angles."
          bash .github/scripts/push_artifacts.sh
