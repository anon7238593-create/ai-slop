<svg xmlns="http://www.w3.org/2000/svg" width="765" height="648" viewBox="0 0 765 648">
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <text x="382.5" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#172033">Euclidean algorithm: gcd(105, 70) = 35</text>
  <text x="382.5" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">Take the biggest squares first; each remaining strip creates a smaller square size.</text>
  <g>
    <rect x="100.00" y="115.00" width="413.33" height="413.33" fill="#ff6b6b" stroke="#172033" stroke-width="2"/>
    <text x="306.67" y="326.67" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172033">70×70</text>
    <rect x="513.33" y="321.67" width="206.67" height="206.67" fill="#4dabf7" stroke="#172033" stroke-width="2"/>
    <text x="616.67" y="430.00" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172033">35×35</text>
    <rect x="513.33" y="115.00" width="206.67" height="206.67" fill="#4dabf7" stroke="#172033" stroke-width="2"/>
    <text x="616.67" y="223.33" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172033">35×35</text>
  </g>
  <rect x="100" y="550.3" width="15" height="15" fill="#ff6b6b" stroke="#172033"/>
  <text x="122" y="563.3" font-family="Arial, sans-serif" font-size="14" fill="#172033">Step 1: 1 square(s) of 70×70</text>
  <rect x="305" y="550.3" width="15" height="15" fill="#4dabf7" stroke="#172033"/>
  <text x="327" y="563.3" font-family="Arial, sans-serif" font-size="14" fill="#172033">Step 2: 2 square(s) of 35×35</text>
  <text x="410.0" y="628.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#172033">Width = 105</text>
  <text x="30" y="321.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#172033" transform="rotate(-90 30 321.7)">Height = 70</text>
</svg>