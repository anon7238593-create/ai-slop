<svg xmlns="http://www.w3.org/2000/svg" width="718" height="665" viewBox="0 0 718 665">
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <text x="359.2" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#172033">Euclidean algorithm: gcd(48, 36) = 12</text>
  <text x="359.2" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">Take the biggest squares first; each remaining strip creates a smaller square size.</text>
  <g>
    <rect x="100.00" y="115.00" width="430.00" height="430.00" fill="#ff6b6b" stroke="#172033" stroke-width="2"/>
    <text x="315.00" y="335.00" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172033">36×36</text>
    <rect x="530.00" y="401.67" width="143.33" height="143.33" fill="#4dabf7" stroke="#172033" stroke-width="2"/>
    <text x="601.67" y="478.33" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172033">12×12</text>
    <rect x="530.00" y="258.33" width="143.33" height="143.33" fill="#4dabf7" stroke="#172033" stroke-width="2"/>
    <text x="601.67" y="335.00" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172033">12×12</text>
    <rect x="530.00" y="115.00" width="143.33" height="143.33" fill="#4dabf7" stroke="#172033" stroke-width="2"/>
    <text x="601.67" y="191.67" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172033">12×12</text>
  </g>
  <rect x="100" y="567.0" width="15" height="15" fill="#ff6b6b" stroke="#172033"/>
  <text x="122" y="580.0" font-family="Arial, sans-serif" font-size="14" fill="#172033">Step 1: 1 square(s) of 36×36</text>
  <rect x="305" y="567.0" width="15" height="15" fill="#4dabf7" stroke="#172033"/>
  <text x="327" y="580.0" font-family="Arial, sans-serif" font-size="14" fill="#172033">Step 2: 3 square(s) of 12×12</text>
  <text x="386.7" y="645.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#172033">Width = 48</text>
  <text x="30" y="330.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#172033" transform="rotate(-90 30 330.0)">Height = 36</text>
</svg>