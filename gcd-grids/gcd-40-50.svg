    <text x="475.00" y="223.67" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#172033">10×10</text>
    <rect x="560.00" y="130.00" width="170.00" height="170.00" fill="#4dabf7" stroke="#172033" stroke-width="2.5"/>
    <text x="645.00" y="223.67" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#172033">10×10</text>
    <rect x="730.00" y="130.00" width="170.00" height="170.00" fill="#4dabf7" stroke="#172033" stroke-width="2.5"/>
    <text x="815.00" y="223.67" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#172033">10×10</text>
    <rect x="900.00" y="130.00" width="170.00" height="170.00" fill="#4dabf7" stroke="#172033" stroke-width="2.5"/>
    <text x="985.00" y="223.67" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#172033">10×10</text>
  </g>
  <rect x="130.0" y="1052.0" width="22" height="22" fill="#ff6b6b" stroke="#172033" stroke-width="1.5"/>
  <text x="162.0" y="1070.0" font-family="Arial, sans-serif" font-size="18" fill="#172033">Step 1: 1 square(s) of 40×40</text>
  <rect x="530.0" y="1052.0" width="22" height="22" fill="#4dabf7" stroke="#172033" stroke-width="1.5"/>
  <text x="562.0" y="1070.0" font-family="Arial, sans-serif" font-size="18" fill="#172033">Step 2: 4 square(s) of 10×10</text>
  <text x="730.0" y="1025.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#172033">Width = 40</text>
  <text x="350.0" y="555.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#172033" transform="rotate(-90 350.0 555.0)">Height = 50</text>
</svg>