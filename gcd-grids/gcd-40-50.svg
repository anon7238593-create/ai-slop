<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1151" viewBox="0 0 1400 1151" style="max-width: 100%; height: auto;">
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <text x="700.0" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#172033">Euclidean algorithm: gcd(40, 50) = 10</text>
  <text x="700.0" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#475569">Take the biggest squares first; each remaining strip creates a smaller square size. Seed 3212320854.</text>
  <g>
    <rect x="390.00" y="300.00" width="680.00" height="680.00" fill="#ff6b6b" stroke="#172033" stroke-width="2.5"/>
