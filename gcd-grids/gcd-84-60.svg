<svg xmlns="http://www.w3.org/2000/svg" width="747" height="665" viewBox="0 0 747 665">
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <text x="373.5" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#172033">Euclidean algorithm: gcd(84, 60) = 12</text>
  <text x="373.5" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">Take the biggest squares first; each remaining strip creates a smaller square size.</text>
  <g>
    <rect x="100.00" y="115.00" width="430.00" height="430.00" fill="#ff6b6b" stroke="#172033" stroke-width="2"/>
    <text x="315.00" y="335.00" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172033">60×60</text>
    <rect x="530.00" y="373.00" width="172.00" height="172.00" fill="#4dabf7" stroke="#172033" stroke-width="2"/>
    <text x="616.00" y="464.00" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172033">24×24</text>
    <rect x="530.00" y="201.00" width="172.00" height="172.00" fill="#4dabf7" stroke="#172033" stroke-width="2"/>
    <text x="616.00" y="292.00" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172033">24×24</text>
    <rect x="530.00" y="115.00" width="86.00" height="86.00" fill="#51cf66" stroke="#172033" stroke-width="2"/>
    <text x="573.00" y="163.00" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172033">12×12</text>
    <rect x="616.00" y="115.00" width="86.00" height="86.00" fill="#51cf66" stroke="#172033" stroke-width="2"/>
    <text x="659.00" y="163.00" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172033">12×12</text>
  </g>
  <rect x="100" y="567.0" width="15" height="15" fill="#ff6b6b" stroke="#172033"/>
  <text x="122" y="580.0" font-family="Arial, sans-serif" font-size="14" fill="#172033">Step 1: 1 square(s) of 60×60</text>
  <rect x="305" y="567.0" width="15" height="15" fill="#4dabf7" stroke="#172033"/>
  <text x="327" y="580.0" font-family="Arial, sans-serif" font-size="14" fill="#172033">Step 2: 2 square(s) of 24×24</text>
  <rect x="510" y="567.0" width="15" height="15" fill="#51cf66" stroke="#172033"/>
  <text x="532" y="580.0" font-family="Arial, sans-serif" font-size="14" fill="#172033">Step 3: 2 square(s) of 12×12</text>
  <text x="401.0" y="645.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#172033">Width = 84</text>
  <text x="30" y="330.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#172033" transform="rotate(-90 30 330.0)">Height = 60</text>
</svg>